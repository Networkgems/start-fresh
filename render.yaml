# Render Blueprint — infra-as-code for the Start Fresh service.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: start-fresh
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
